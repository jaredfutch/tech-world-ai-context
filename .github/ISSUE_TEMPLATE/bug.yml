name: Framework bug
description: Report reproducible behavior that conflicts with the published framework or documentation
title: "Bug: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, customer data, private correspondence, contracts, financial data, or other sensitive material.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Framework version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide sanitized steps or examples.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What files, outputs, or observations support the report?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private and sensitive data from this report.
          required: true
